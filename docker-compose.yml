services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tienda
    ports:
      - 5434:5432
    volumes:
    - datos:/var/lib/postgresql
  
  pgadmin-compose:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "hquintan@ulima.edu.pe"
      PGADMIN_DEFAULT_PASSWORD: "postgres"
    ports:
      - "3001:80"
    depends_on:
      - db
volumes:
  datos: